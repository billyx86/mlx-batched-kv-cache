name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # MLX requires Apple Silicon, so tests run on the macOS ARM runners.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -q
